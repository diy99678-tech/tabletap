name: Keep Supabase awake
on:
  schedule:
    - cron: "17 2,14 * * *"   # 07:47 and 19:47 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database and sign-in server
        run: |
          curl -fsS -m 60 "$URL/rest/v1/plans?select=id" -H "apikey: $KEY" > /dev/null
          curl -fsS -m 60 "$URL/auth/v1/settings" -H "apikey: $KEY" > /dev/null
        env:
          URL: https://rxouxrwijknfkvgsjkkw.supabase.co
          KEY: sb_publishable_TudiR90qo6_pzJ7HUQRtMQ_Hp5rzrdv
